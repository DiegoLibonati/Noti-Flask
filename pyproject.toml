[project]
name = "noti"
version = "1.0.0"
description = "Noti is a full-stack personal note-taking web application built with Python and Flask, following a clean MVC architecture with a strict separation between the API layer and the server-side rendered views."
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-migrate==4.1.0",
    "flask-login==0.6.3",
    "werkzeug==3.1.8",
    "gunicorn==23.0.0",
    "pymysql==1.1.3",
    "cryptography==50.0.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "livereload==2.7.0",
    "pip-audit==2.7.3",
    "ruff==0.11.12",
    "mypy==1.13.0",
]
test = [
    "pytest==9.0.3",
    "pytest-env==1.1.5",
    "pytest-cov==4.1.0",
    "pytest-timeout==2.3.1",
    "pytest-xdist==3.5.0",
]

[tool.distutils.egg_info]
egg_base = "."

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
log_cli = true
log_cli_level = "WARNING"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
env = [
    "HOST=0.0.0.0",
    "PORT=5050",
    "SECRET_KEY=secret_key",
    "MYSQL_ROOT_PASSWORD=root",
    "MYSQL_HOST=localhost",
    "MYSQL_PORT=3307",
    "MYSQL_USER=noti_user",
    "MYSQL_PASSWORD=noti_pass",
    "MYSQL_DB_NAME=noti_db",
]


[tool.ruff]
line-length = 120
exclude = [".git", "__pycache__", "env", "venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "C4", "RET", "RUF"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "SIM117", "B017"]
"src/configs/*.py" = ["S104"]
"src/configs/testing_config.py" = ["S104", "S105", "S106"]
"src/constants/codes.py" = ["S105"]
"src/constants/messages.py" = ["S105"]
"app.py" = ["S606"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["venv", "tests", "build/", "dist/", "migrations/"]

[[tool.mypy.overrides]]
module = "src.models.orm.*"
disable_error_code = ["name-defined"]